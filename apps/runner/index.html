<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Loading</title>
    <!-- The loading screen, in the colours of theme.ts, so the first frame is never a blank page. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0e1a33; color: #ffffff; font: 17px system-ui, -apple-system, "Segoe UI", sans-serif; }
      [data-screen="loading"] { box-sizing: border-box; min-height: 100%; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
      [data-screen="loading"] h1 { margin: 0; font-size: 38px; color: #ff7a1a; text-align: center; }
      [data-screen="loading"] .cue { display: flex; gap: 12px; }
      [data-screen="loading"] .cue span { width: 14px; height: 14px; border-radius: 50%; background: #35c2c9; animation: loading-pulse 1.2s ease-in-out infinite; }
      [data-screen="loading"] .cue span:nth-child(2) { animation-delay: 0.2s; }
      [data-screen="loading"] .cue span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes loading-pulse { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { [data-screen="loading"] .cue span { animation: none; opacity: 0.8; } }
    </style>
  </head>
  <body>
    <div data-screen="loading" role="status" aria-label="Loading"><h1>__GAME_TITLE__</h1><div class="cue" aria-hidden="true"><span></span><span></span><span></span></div></div>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
